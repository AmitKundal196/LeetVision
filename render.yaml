services:
  - type: web
    name: leetvision-fullstack
    env: node
    plan: free
    # Run the install:all and build scripts from the root package.json
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      # This tells the frontend to use the same domain for API requests
      - key: VITE_API_URL
        value: /api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
